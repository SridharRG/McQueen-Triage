[package]
name = "mcqueen-triage"
version = "0.1.0"
edition = "2021"
description = "Self-hosted AI triage for the Regere microservice stack: tails Docker logs, rebuilds request traces from W3C trace ids, assembles code + DB schema context and asks an LLM for a root cause."
publish = false

[[bin]]
name = "mcqueen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bollard = "0.21"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rig-core = { version = "0.45", features = ["reqwest"] }
rig-agent = "0.45"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
